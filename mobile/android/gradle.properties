org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler crashes (IllegalArgumentException: "this and base files have
# different roots") when the project and the Gradle/Pub caches live on different Windows drive
# letters - this project is on D: while the Pub cache is under C:\Users\...\AppData. Disabling
# incremental compilation avoids the cross-drive relative-path computation that trips this bug.
kotlin.incremental=false
